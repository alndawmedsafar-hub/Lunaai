<!DOCTYPE html>
<html lang="ckb" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LumaAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #ffffff;
      --bg-sidebar: #f9f9f9;
      --bg-surface: #f4f4f4;
      --bg-hover: #ececec;
      --bg-code: #0d0d0d;
      --bg-code-header: #1e1e1e;
      --text-primary: #0d0d0d;
      --text-secondary: #5d5d5d;
      --text-muted: #8e8e8e;
      --border-color: rgba(0, 0, 0, 0.09);
      --accent: #10a37f;
      --btn-send-bg: #0d0d0d;
      --btn-send-fg: #ffffff;
      --shadow-composer: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    html.dark {
      --bg-main: #212121;
      --bg-sidebar: #171717;
      --bg-surface: #2f2f2f;
      --bg-hover: #2a2a2a;
      --bg-code: #0d0d0d;
      --bg-code-header: #262626;
      --text-primary: #ececec;
      --text-secondary: #b4b4b4;
      --text-muted: #8e8e8e;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #10a37f;
      --btn-send-bg: #ffffff;
      --btn-send-fg: #0d0d0d;
      --shadow-composer: 0 6px 24px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Vazirmatn', 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100dvh;
      overflow: hidden;
      display: flex;
    }

    code, pre, textarea.code-editor {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(142, 142, 142, 0.35);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(142, 142, 142, 0.55);
    }

    /* Layout */
    .app-shell {
      display: flex;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 268px;
      background: var(--bg-sidebar);
      border-inline-end: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s ease, transform 0.25s ease;
      z-index: 40;
    }

    .sidebar.collapsed {
      width: 0;
      border-inline-end: none;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 10px;
    }
    .brand-btn:hover {
      background: var(--bg-hover);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .new-chat-btn {
      margin: 0 12px 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s;
    }
    .new-chat-btn:hover {
      background: var(--bg-hover);
    }

    .search-wrap {
      padding: 0 12px 10px;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .search-input::placeholder {
      color: var(--text-muted);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 12px;
    }

    .history-group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 10px 10px 6px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13.5px;
      color: var(--text-secondary);
      transition: background 0.15s, color 0.15s;
    }
    .history-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .history-item.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 500;
    }
    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .history-actions {
      display: none;
      align-items: center;
      gap: 2px;
    }
    .history-item:hover .history-actions,
    .history-item.active .history-actions {
      display: flex;
    }
    .mini-action {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: inline-flex;
    }
    .mini-action:hover {
      color: var(--text-primary);
      background: rgba(128, 128, 128, 0.16);
    }

    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .theme-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .theme-btn:hover {
      background: var(--bg-hover);
    }

    /* Main Workspace (Chat + Code Board Split) */
    .workspace {
      flex: 1;
      display: flex;
      min-width: 0;
      height: 100dvh;
    }

    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
      position: relative;
    }

    /* Top Header */
    .topbar {
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .model-select {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .model-select:hover {
      background: var(--bg-hover);
    }
    .board-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .board-toggle-btn:hover {
      background: var(--bg-hover);
    }
    .board-toggle-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Messages */
    .messages-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 28px;
    }
    .messages-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Empty State */
    .empty-state {
      min-height: calc(100dvh - 240px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 18px;
      padding: 20px;
    }
    .empty-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
    }
    .empty-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .empty-sub {
      color: var(--text-secondary);
      font-size: 14px;
      max-width: 460px;
      line-height: 1.7;
    }
    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin-top: 8px;
    }
    .suggestion-card {
      text-align: start;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .suggestion-card:hover {
      background: var(--bg-surface);
    }
    .suggestion-card strong {
      display: block;
      font-size: 13.5px;
      margin-bottom: 4px;
    }
    .suggestion-card span {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    /* Message Rows */
    .msg-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .msg-row.user {
      justify-content: flex-end;
    }
    .user-bubble {
      max-width: 82%;
      background: var(--bg-surface);
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .assistant-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .assistant-body {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      line-height: 1.8;
    }
    .assistant-body p {
      margin-bottom: 12px;
    }
    .assistant-body p:last-child {
      margin-bottom: 0;
    }

    /* Media attachments inside messages */
    .msg-media-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .msg-media-item {
      max-width: 280px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #000;
    }
    .msg-media-item img,
    .msg-media-item video {
      display: block;
      max-width: 100%;
      max-height: 240px;
      object-fit: cover;
    }

    /* Inline Code Block inside Chat */
    .chat-code-card {
      margin: 12px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: var(--bg-code);
      color: #e6edf3;
      direction: ltr;
      text-align: left;
    }
    .chat-code-header {
      background: var(--bg-code-header);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #b4b4b4;
    }
    .chat-code-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .code-mini-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #ececec;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-family: 'Vazirmatn', 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .code-mini-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }
    .chat-code-pre {
      padding: 14px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Composer */
    .composer-area {
      padding: 8px 16px 14px;
    }
    .composer-box {
      max-width: 780px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 10px 14px;
      box-shadow: var(--shadow-composer);
      transition: border-color 0.15s;
    }
    .composer-box.drag-over {
      border-color: var(--accent);
    }

    .pending-media {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .pending-thumb {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #000;
    }
    .pending-thumb img,
    .pending-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .remove-media {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .composer-textarea {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      resize: none;
      outline: none;
      max-height: 180px;
      min-height: 28px;
      padding: 4px 2px;
    }
    .composer-textarea::placeholder {
      color: var(--text-muted);
    }

    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
    .composer-left-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tool-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tool-pill:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--btn-send-bg);
      color: var(--btn-send-fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
    }
    .send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .send-btn:not(:disabled):hover {
      transform: scale(1.04);
    }

    .disclaimer {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Dedicated Code Board Panel (تەختەی کۆد) */
    .code-board {
      width: 0;
      overflow: hidden;
      border-inline-start: 0 solid var(--border-color);
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      transition: width 0.22s ease;
    }
    .code-board.open {
      width: 48%;
      min-width: 420px;
      border-inline-start: 1px solid var(--border-color);
    }

    .board-header {
      height: 56px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .board-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .board-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg-surface);
      border-radius: 9px;
    }
    .board-tab {
      padding: 5px 11px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .board-tab.active {
      background: var(--bg-main);
      color: var(--text-primary);
    }

    .board-actions-bar {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .board-lang-select {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12.5px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }
    .board-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .board-body {
      flex: 1;
      display: flex;
      min-height: 0;
      background: var(--bg-code);
      direction: ltr;
      position: relative;
    }
    .line-numbers {
      width: 46px;
      padding: 16px 8px;
      background: #141414;
      color: #6e7681;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.65;
      text-align: right;
      user-select: none;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    textarea.code-editor {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 16px;
      background: #0d0d0d;
      color: #e6edf3;
      font-size: 13.5px;
      line-height: 1.65;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
    }
    .preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
    .board-footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Responsive Mobile */
    @media (max-width: 960px) {
      .sidebar {
        position: fixed;
        inset-block: 0;
        inset-inline-start: 0;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      .sidebar.collapsed {
        transform: translateX(100%);
        width: 268px;
      }
      html[dir="ltr"] .sidebar.collapsed {
        transform: translateX(-100%);
      }
      .code-board.open {
        position: fixed;
        inset: 0;
        width: 100%;
        min-width: 100%;
        z-index: 50;
      }
      .suggestions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar: Chat History (بەشی مێژووی چات) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <button class="brand-btn" onclick="createNewChat()">
          <span class="luma-logo-slot"></span>
          <span>LumaAI</span>
        </button>
        <button class="icon-btn" onclick="toggleSidebar()" title="داخستنی لیست">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <line x1="9" y1="3" x2="9" y2="21" />
          </svg>
        </button>
      </div>

      <button class="new-chat-btn" onclick="createNewChat()">
        <span>+ چاتی نوێ</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </button>

      <div class="search-wrap">
        <input id="historySearch" class="search-input" type="text" placeholder="گەڕان لە مێژووی چات..." oninput="renderHistory()" />
      </div>

      <div id="historyList" class="history-list"></div>

      <div class="sidebar-footer">
        <div class="footer-row">
          <button class="theme-btn" onclick="toggleTheme()">
            <span id="themeLabel">دۆخی ڕووناک</span>
          </button>
          <button class="theme-btn" onclick="clearAllHistory()">
            <span>سڕینەوەی مێژوو</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="workspace">
      <!-- Chat Pane -->
      <main class="chat-pane">
        <header class="topbar">
          <div class="topbar-left">
            <button id="openSidebarBtn" class="icon-btn" onclick="toggleSidebar()" style="display: none;" title="کردنەوەی لیست">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="9" y1="3" x2="9" y2="21" />
              </svg>
            </button>
            <button class="model-select" onclick="cycleMode()" title="گۆڕینی مۆدێلی LumaAI">
              <span class="luma-logo-slot"></span>
              <span id="modelLabel">LumaAI 4</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
          </div>

          <button id="boardToggleBtn" class="board-toggle-btn" onclick="toggleCodeBoard()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
            <span>تەختەی کۆد</span>
          </button>
        </header>

        <div id="messagesScroll" class="messages-scroll">
          <div id="messagesInner" class="messages-inner"></div>
        </div>

        <!-- Composer -->
        <div class="composer-area">
          <div id="composerBox" class="composer-box">
            <div id="pendingMedia" class="pending-media"></div>
            <textarea
              id="promptInput"
              class="composer-textarea"
              rows="1"
              placeholder="پرسیارێک لە LumaAI بکە یان کۆد داوا بکە..."
              oninput="autoResize(this); updateSendState();"
              onkeydown="handlePromptKey(event)"
            ></textarea>
            <div class="composer-toolbar">
              <div class="composer-left-tools">
                <input
                  id="mediaInput"
                  type="file"
                  accept="image/*,video/*"
                  multiple
                  hidden
                  onchange="handleFilesSelected(event)"
                />
                <button class="tool-pill" onclick="document.getElementById('mediaInput').click()">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <path d="m21 15-5-5L5 21" />
                  </svg>
                  <span>وێنە و ڤیدیۆ</span>
                </button>
                <button class="tool-pill" onclick="toggleCodeBoard(true)">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6" />
                    <polyline points="8 6 2 12 8 18" />
                  </svg>
                  <span>کردنەوەی تەختەی کۆد</span>
                </button>
              </div>

              <button id="sendBtn" class="send-btn" disabled onclick="sendMessage()" title="ناردن">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M12 19V5" />
                  <path d="m5 12 7-7 7 7" />
                </svg>
              </button>
            </div>
          </div>
          <div class="disclaimer">LumaAI دەکرێت هەڵە بکات. زانیارییە گرنگەکان بپشکنەوە.</div>
        </div>
      </main>

      <!-- Dedicated Code Board (تەختەی تایبەت بە کۆد) -->
      <section id="codeBoard" class="code-board" aria-label="تەختەی کۆد">
        <div class="board-header">
          <div class="board-title-group">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6" />
              <polyline points="8 6 2 12 8 18" />
            </svg>
            <span>تەختەی کۆدی LumaAI</span>
          </div>

          <div class="board-tabs">
            <button id="tabCodeBtn" class="board-tab active" onclick="setBoardMode('code')">کۆد</button>
            <button id="tabPreviewBtn" class="board-tab" onclick="setBoardMode('preview')">پیشاندانی ڕاستەوخۆ</button>
          </div>

          <button class="icon-btn" onclick="toggleCodeBoard(false)" title="داخستن">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>

        <div class="board-actions-bar">
          <select id="boardLang" class="board-lang-select" onchange="updateBoardStats()">
            <option value="html">HTML / CSS / JS</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="css">CSS</option>
          </select>

          <div class="board-btn-group">
            <button class="code-mini-btn" onclick="sendBoardToChat('ڕوونی بکەرەوە')">ڕوونکردنەوە</button>
            <button class="code-mini-btn" onclick="sendBoardToChat('باشتری بکە')">باشترکردن</button>
            <button id="copyBoardBtn" class="code-mini-btn" onclick="copyBoardCode()">کۆپی</button>
            <button class="code-mini-btn" onclick="downloadBoardCode()">داگرتن</button>
          </div>
        </div>

        <div id="boardCodeView" class="board-body">
          <div id="lineNumbers" class="line-numbers">1</div>
          <textarea
            id="codeEditor"
            class="code-editor"
            spellcheck="false"
            oninput="onCodeEdit()"
            onscroll="syncLineScroll()"
          ></textarea>
        </div>

        <div id="boardPreviewView" class="board-body" style="display: none;">
          <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts"></iframe>
        </div>

        <div class="board-footer">
          <span id="boardStats">0 دێڕ · 0 پیت</span>
          <span>LumaAI Code Canvas</span>
        </div>
      </section>
    </div>
  </div>

  <script>
    // لۆگۆی هاوشێوەی ChatGPT بە SVG
    const LUMA_LOGO_SVG = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="LumaAI Logo">
        <path d="M12 2.5a4.2 4.2 0 0 1 3.64 2.1l3.6 6.24a4.2 4.2 0 0 1 0 4.2l-1.8 3.12a4.2 4.2 0 0 1-5.74 1.54L8.1 17.6" />
        <path d="M19.24 10.84a4.2 4.2 0 0 1-2.1 3.64l-6.24 3.6a4.2 4.2 0 0 1-4.2 0L3.58 16.3a4.2 4.2 0 0 1-1.54-5.74l2.08-3.6" />
        <path d="M12 21.5a4.2 4.2 0 0 1-3.64-2.1l-3.6-6.24a4.2 4.2 0 0 1 0-4.2l1.8-3.12a4.2 4.2 0 0 1 5.74-1.54l3.6 2.08" />
        <circle cx="12" cy="12" r="2.2" />
      </svg>
    `;

    document.querySelectorAll('.luma-logo-slot').forEach(el => {
      el.innerHTML = LUMA_LOGO_SVG;
    });

    const STORAGE_KEY = 'luma_ai_chats_v1';
    const MODES = ['LumaAI 4', 'LumaAI Code', 'LumaAI Vision'];
    let currentModeIdx = 0;

    let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let activeChatId = chats[0]?.id || null;
    let pendingAttachments = [];
    let isBoardOpen = false;
    let boardViewMode = 'code';

    const DEFAULT_BOARD_CODE = `<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #111827;
      color: #f9fafb;
    }
    .card {
      padding: 28px 36px;
      border-radius: 16px;
      background: #1f2937;
      border: 1px solid #374151;
      text-align: center;
    }
    button {
      margin-top: 14px;
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: #10a37f;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>بەخێربێیت بۆ تەختەی کۆدی LumaAI</h2>
    <p>لێرەدا دەتوانیت کۆد بنووسیت و ڕاستەوخۆ بیبینیت.</p>
    <button onclick="this.textContent='کاردەکات!'">تاقیبکەرەوە</button>
  </div>
</body>
</html>`;

    document.getElementById('codeEditor').value = DEFAULT_BOARD_CODE;
    onCodeEdit();

    function saveChats() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
      } catch (e) {
        console.warn('بیرگەی وێبگەڕ پڕبووە');
      }
    }

    function getActiveChat() {
      return chats.find(c => c.id === activeChatId) || null;
    }

    function createNewChat() {
      activeChatId = null;
      pendingAttachments = [];
      renderPendingMedia();
      renderMessages();
      renderHistory();
      document.getElementById('promptInput').focus();
    }

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const openBtn = document.getElementById('openSidebarBtn');
      sb.classList.toggle('collapsed');
      openBtn.style.display = sb.classList.contains('collapsed') ? 'inline-flex' : 'none';
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      document.getElementById('themeLabel').textContent = isDark ? 'دۆخی ڕووناک' : 'دۆخی تاریک';
    }

    function cycleMode() {
      currentModeIdx = (currentModeIdx + 1) % MODES.length;
      document.getElementById('modelLabel').textContent = MODES[currentModeIdx];
    }

    // مێژووی چات
    function renderHistory() {
      const list = document.getElementById('historyList');
      const query = document.getElementById('historySearch').value.trim().toLowerCase();
      const filtered = chats.filter(c => c.title.toLowerCase().includes(query));

      if (filtered.length === 0) {
        list.innerHTML = `<div style="padding:16px;text-align:center;font-size:13px;color:var(--text-muted);">هیچ چاتێک نییە</div>`;
        return;
      }

      list.innerHTML = `<div class="history-group-title">مێژووی چاتەکان</div>`;
      filtered.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'history-item' + (chat.id === activeChatId ? ' active' : '');
        item.onclick = () => {
          activeChatId = chat.id;
          renderHistory();
          renderMessages();
        };

        const titleSpan = document.createElement('span');
        titleSpan.className = 'history-title';
        titleSpan.textContent = chat.title;

        const actions = document.createElement('div');
        actions.className = 'history-actions';

        const renameBtn = document.createElement('button');
        renameBtn.className = 'mini-action';
        renameBtn.title = 'گۆڕینی ناو';
        renameBtn.innerHTML = '✎';
        renameBtn.onclick = (e) => {
          e.stopPropagation();
          const next = prompt('ناوی نوێ بۆ چاتەکە:', chat.title);
          if (next && next.trim()) {
            chat.title = next.trim();
            saveChats();
            renderHistory();
          }
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'mini-action';
        delBtn.title = 'سڕینەوە';
        delBtn.innerHTML = '✕';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          chats = chats.filter(c => c.id !== chat.id);
          if (activeChatId === chat.id) activeChatId = chats[0]?.id || null;
          saveChats();
          renderHistory();
          renderMessages();
        };

        actions.append(renameBtn, delBtn);
        item.append(titleSpan, actions);
        list.appendChild(item);
      });
    }

    function clearAllHistory() {
      chats = [];
      activeChatId = null;
      saveChats();
      renderHistory();
      renderMessages();
    }

    // ناردنی وێنە و ڤیدیۆ
    function handleFilesSelected(e) {
      addFiles(Array.from(e.target.files || []));
      e.target.value = '';
    }

    function addFiles(files) {
      files.forEach(file => {
        if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) return;
        const reader = new FileReader();
        reader.onload = () => {
          pendingAttachments.push({
            id: Math.random().toString(36).slice(2),
            name: file.name,
            type: file.type.startsWith('video/') ? 'video' : 'image',
            dataUrl: reader.result
          });
          renderPendingMedia();
          updateSendState();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPendingMedia() {
      const box = document.getElementById('pendingMedia');
      box.innerHTML = '';
      pendingAttachments.forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'pending-thumb';
        if (item.type === 'video') {
          const v = document.createElement('video');
          v.src = item.dataUrl;
          v.muted = true;
          wrap.appendChild(v);
        } else {
          const img = document.createElement('img');
          img.src = item.dataUrl;
          img.alt = item.name;
          wrap.appendChild(img);
        }
        const rm = document.createElement('button');
        rm.className = 'remove-media';
        rm.textContent = '×';
        rm.onclick = () => {
          pendingAttachments = pendingAttachments.filter(p => p.id !== item.id);
          renderPendingMedia();
          updateSendState();
        };
        wrap.appendChild(rm);
        box.appendChild(wrap);
      });
    }

    // Drag & Drop بۆ وێنە و ڤیدیۆ
    const composerBox = document.getElementById('composerBox');
    composerBox.addEventListener('dragover', e => {
      e.preventDefault();
      composerBox.classList.add('drag-over');
    });
    composerBox.addEventListener('dragleave', () => composerBox.classList.remove('drag-over'));
    composerBox.addEventListener('drop', e => {
      e.preventDefault();
      composerBox.classList.remove('drag-over');
      addFiles(Array.from(e.dataTransfer.files || []));
    });

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 180) + 'px';
    }

    function updateSendState() {
      const text = document.getElementById('promptInput').value.trim();
      document.getElementById('sendBtn').disabled = !text && pendingAttachments.length === 0;
    }

    function handlePromptKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!document.getElementById('sendBtn').disabled) sendMessage();
      }
    }

    // پیشاندانی چات و دۆخی سەرەتا
    function renderMessages() {
      const container = document.getElementById('messagesInner');
      const chat = getActiveChat();

      if (!chat || chat.messages.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-logo">${LUMA_LOGO_SVG}</div>
            <h1 class="empty-title">چۆن دەتوانم یارمەتیت بدەم؟</h1>
            <p class="empty-sub">من LumaAIـم. دەتوانیت پرسیارم لێ بکەیت، وێنە و ڤیدیۆ بنێریت، یان لە تەختەی کۆددا بەرنامە بنووسین.</p>
            <div class="suggestions">
              <button class="suggestion-card" onclick="useSuggestion('کۆدێکی HTML و CSS بۆ کارتێکی مۆدێرن دروست بکە')">
                <strong>نووسینی کۆد لە تەختەکە</strong>
                <span>کارتێکی جوان بە HTML و CSS</span>
              </button>
              <button class="suggestion-card" onclick="useSuggestion('چۆن کاردەکات تەختەی کۆدی LumaAI؟')">
                <strong>ناسینی LumaAI</strong>
                <span>زانیاری لەسەر تایبەتمەندییەکان</span>
              </button>
              <button class="suggestion-card" onclick="document.getElementById('mediaInput').click()">
                <strong>ناردنی وێنە و ڤیدیۆ</strong>
                <span>وێنە یان ڤیدیۆ باربکە بۆ شیکردنەوە</span>
              </button>
              <button class="suggestion-card" onclick="useSuggestion('کۆدێکی JavaScript بۆ کاتژمێری دیجیتاڵی بنووسە')">
                <strong>پرۆژەی JavaScript</strong>
                <span>کاتژمێری ڕاستەوخۆ بە کۆد</span>
              </button>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      chat.messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = 'msg-row ' + msg.role;

        if (msg.role === 'user') {
          const bubble = document.createElement('div');
          bubble.className = 'user-bubble';
          if (msg.attachments?.length) {
            bubble.appendChild(createMediaGrid(msg.attachments));
          }
          if (msg.text) {
            const txt = document.createElement('div');
            txt.textContent = msg.text;
            bubble.appendChild(txt);
          }
          row.appendChild(bubble);
        } else {
          const avatar = document.createElement('div');
          avatar.className = 'assistant-avatar';
          avatar.innerHTML = LUMA_LOGO_SVG;

          const body = document.createElement('div');
          body.className = 'assistant-body';
          renderAssistantContent(body, msg.text);

          row.append(avatar, body);
        }

        container.appendChild(row);
      });

      const scrollBox = document.getElementById('messagesScroll');
      scrollBox.scrollTop = scrollBox.scrollHeight;
    }

    function createMediaGrid(attachments) {
      const grid = document.createElement('div');
      grid.className = 'msg-media-grid';
      attachments.forEach(att => {
        const item = document.createElement('div');
        item.className = 'msg-media-item';
        if (att.type === 'video') {
          const v = document.createElement('video');
          v.src = att.dataUrl;
          v.controls = true;
          item.appendChild(v);
        } else {
          const img = document.createElement('img');
          img.src = att.dataUrl;
          img.alt = att.name || 'image';
          item.appendChild(img);
        }
        grid.appendChild(item);
      });
      return grid;
    }

    function renderAssistantContent(container, text) {
      const codeRegex = /```(\w+)?\n([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;

      while ((match = codeRegex.exec(text)) !== null) {
        const before = text.slice(lastIndex, match.index).trim();
        if (before) {
          const p = document.createElement('p');
          p.textContent = before;
          container.appendChild(p);
        }

        const lang = (match[1] || 'html').toLowerCase();
        const code = match[2].trim();
        container.appendChild(createCodeCard(lang, code));
        lastIndex = codeRegex.lastIndex;
      }

      const after = text.slice(lastIndex).trim();
      if (after) {
        const p = document.createElement('p');
        p.textContent = after;
        container.appendChild(p);
      }
    }

    function createCodeCard(lang, code) {
      const card = document.createElement('div');
      card.className = 'chat-code-card';

      const header = document.createElement('div');
      header.className = 'chat-code-header';

      const langLabel = document.createElement('span');
      langLabel.textContent = lang.toUpperCase();

      const actions = document.createElement('div');
      actions.className = 'chat-code-actions';

      const openBtn = document.createElement('button');
      openBtn.className = 'code-mini-btn';
      openBtn.textContent = 'کردنەوە لە تەختەی کۆد';
      openBtn.onclick = () => loadIntoCodeBoard(code, lang);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'code-mini-btn';
      copyBtn.textContent = 'کۆپی';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(code);
        copyBtn.textContent = 'کۆپی کرا ✓';
        setTimeout(() => (copyBtn.textContent = 'کۆپی'), 1500);
      };

      actions.append(openBtn, copyBtn);
      header.append(langLabel, actions);

      const pre = document.createElement('pre');
      pre.className = 'chat-code-pre';
      const codeEl = document.createElement('code');
      codeEl.textContent = code;
      pre.appendChild(codeEl);

      card.append(header, pre);
      return card;
    }

    function useSuggestion(promptText) {
      const input = document.getElementById('promptInput');
      input.value = promptText;
      autoResize(input);
      updateSendState();
      sendMessage();
    }

    // --- بەشی گۆڕدراو بۆ بەستنەوە بە کارگەی ٣٠ کلیلییەکەی پایتۆن ---
    async function sendMessage() {
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text && pendingAttachments.length === 0) return;

      let chat = getActiveChat();
      if (!chat) {
        chat = {
          id: 'chat_' + Date.now(),
          title: text ? text.slice(0, 34) : 'وێنە / ڤیدیۆی نوێ',
          messages: []
        };
        chats.unshift(chat);
        activeChatId = chat.id;
      }

      chat.messages.push({
        role: 'user',
        text,
        attachments: [...pendingAttachments]
      });

      input.value = '';
      autoResize(input);
      const sentAttachments = [...pendingAttachments];
      pendingAttachments = [];
      renderPendingMedia();
      updateSendState();
      saveChats();
      renderHistory();
      renderMessages();

      // ناردنی داواکاری بۆ سێرڤەری پایتۆن و کارگەی ٣٠ کلیل
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        const replyText = data.response || '❌ هەڵەیەک ڕوویدا لە وەرگرتنی وەڵام.';

        chat.messages.push({ role: 'assistant', text: replyText });
        saveChats();
        renderMessages();

        // پشکنینی ئەگەر لەناو وەڵامەکەدا کۆد هەبێت بۆ تەختەی کۆد
        const codeMatch = replyText.match(/```(\w+)?\n([\s\S]*?)```/);
        if (codeMatch) {
          loadIntoCodeBoard(codeMatch[2].trim(), (codeMatch[1] || 'html').toLowerCase());
        }
      } catch (err) {
        chat.messages.push({ role: 'assistant', text: '❌ پەیوەندی بە سێرڤەرەوە پچڕا!' });
        saveChats();
        renderMessages();
      }
    }

    // تەختەی کۆد (Code Board)
    function toggleCodeBoard(forceState) {
      const board = document.getElementById('codeBoard');
      const btn = document.getElementById('boardToggleBtn');
      isBoardOpen = typeof forceState === 'boolean' ? forceState : !isBoardOpen;
      board.classList.toggle('open', isBoardOpen);
      btn.classList.toggle('active', isBoardOpen);
    }

    function loadIntoCodeBoard(code, lang) {
      const editor = document.getElementById('codeEditor');
      const select = document.getElementById('boardLang');
      editor.value = code;
      if ([...select.options].some(o => o.value === lang)) {
        select.value = lang;
      }
      onCodeEdit();
      toggleCodeBoard(true);
    }

    function setBoardMode(mode) {
      boardViewMode = mode;
      document.getElementById('tabCodeBtn').classList.toggle('active', mode === 'code');
      document.getElementById('tabPreviewBtn').classList.toggle('active', mode === 'preview');
      document.getElementById('boardCodeView').style.display = mode === 'code' ? 'flex' : 'none';
      document.getElementById('boardPreviewView').style.display = mode === 'preview' ? 'flex' : 'none';
      if (mode === 'preview') renderPreview();
    }

    function renderPreview() {
      const code = document.getElementById('codeEditor').value;
      const lang = document.getElementById('boardLang').value;
      const frame = document.getElementById('previewFrame');
      if (lang === 'html') {
        frame.srcdoc = code;
      } else if (lang === 'css') {
        frame.srcdoc = `<style>${code}</style><div style="padding:24px;font-family:sans-serif;">پێشاندانی CSS</div>`;
      } else if (lang === 'javascript') {
        frame.srcdoc = `<!DOCTYPE html><html><body style="font-family:monospace;padding:16px;"><pre id="out"></pre><script>const log=(...a)=>{document.getElementById('out').textContent+=a.join(' ')+'\\n'};console.log=log;try{${code}}catch(e){log('Error:',e.message)}<\/script></body></html>`;
      } else {
        frame.srcdoc = `<pre style="padding:16px;font-family:monospace;">پیشاندانی ڕاستەوخۆ بۆ HTML و CSS و JS کاردەکات.</pre>`;
      }
    }

    function onCodeEdit() {
      const code = document.getElementById('codeEditor').value;
      const lines = code.split('\n').length;
      document.getElementById('lineNumbers').innerHTML = Array.from({ length: lines }, (_, i) => i + 1).join('<br>');
      updateBoardStats();
      if (boardViewMode === 'preview') renderPreview();
    }

    function syncLineScroll() {
      document.getElementById('lineNumbers').scrollTop = document.getElementById('codeEditor').scrollTop;
    }

    function updateBoardStats() {
      const code = document.getElementById('codeEditor').value;
      const lines = code.split('\n').length;
      document.getElementById('boardStats').textContent = `${lines} دێڕ · ${code.length} پیت`;
    }

    function copyBoardCode() {
      const code = document.getElementById('codeEditor').value;
      navigator.clipboard.writeText(code);
      const btn = document.getElementById('copyBoardBtn');
      btn.textContent = 'کۆپی کرا ✓';
      setTimeout(() => (btn.textContent = 'کۆپی'), 1500);
    }

    function downloadBoardCode() {
      const code = document.getElementById('codeEditor').value;
      const lang = document.getElementById('boardLang').value;
      const extMap = { html: 'html', javascript: 'js', typescript: 'ts', python: 'py', css: 'css' };
      const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lumaai-code.${extMap[lang] || 'txt'}`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function sendBoardToChat(actionText) {
      const code = document.getElementById('codeEditor').value.trim();
      if (!code) return;
      const input = document.getElementById('promptInput');
      input.value = `${actionText} بۆ ئەم کۆدە:\n\`\`\`\n${code}\n\`\`\``;
      autoResize(input);
      updateSendState();
      sendMessage();
    }

    // دەستپێکردن
    renderHistory();
    renderMessages();
  </script>
</body>
</html>
